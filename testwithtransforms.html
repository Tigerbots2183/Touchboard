<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <canvas id="gpuCanvas" width="1800" height="1600" style="background: #111; width: 80vw; height:auto;"></canvas>


    <script>
        const shaderCode = `
struct Uniforms {
  resolution : vec2f,
  scale : vec2f,       // Changed to vec2f for separate X/Y scaling
  color : vec4f,
  translation : vec2f, // x, y translation
  width : f32,
};

@group(0) @binding(0) var<uniform> uniforms : Uniforms;

struct VertexOutput {
  @builtin(position) position : vec4f,
};

@vertex
fn vs_main(
  @location(0) curr_raw : vec2f,
  @location(1) prev_raw : vec2f,
  @location(2) next_raw : vec2f,
  @location(3) direction : f32
) -> VertexOutput {
  
  var output : VertexOutput;
  
  // 1. Apply Transform (Scale then Translate)
  // We apply this to the raw points *before* calculating line thickness
  // to ensure the line joins (miters) are calculated correctly for the distorted aspect ratio.
  
  let curr = (curr_raw * uniforms.scale) + uniforms.translation;
  let prev = (prev_raw * uniforms.scale) + uniforms.translation;
  let next = (next_raw * uniforms.scale) + uniforms.translation;

  let halfWidth = uniforms.width / 2.0;

  // 2. Line Expansion (Miter Join Logic)
  var dirA = normalize(curr - prev);
  var dirB = normalize(next - curr);

  if (all(curr == prev)) { dirA = dirB; }
  if (all(curr == next)) { dirB = dirA; }

  var tangent = normalize(dirA + dirB);
  var normal = vec2f(-tangent.y, tangent.x);
  
  // Miter calculation
  var miter = vec2f(-dirA.y, dirA.x);
  let miterDot = dot(miter, normal);
  let miterLength = halfWidth / max(miterDot, 0.1); 

  let offset = normal * direction * miterLength;
  let pos = curr + offset;

  // 3. Screen Space Conversion
  let clipX = (pos.x / uniforms.resolution.x) * 2.0 - 1.0;
  let clipY = (1.0 - (pos.y / uniforms.resolution.y)) * 2.0 - 1.0;

  output.position = vec4f(clipX, clipY, 0.0, 1.0);
  return output;
}

@fragment
fn fs_main() -> @location(0) vec4f {
  return uniforms.color;
}
`;

        class WebGPULineRenderer {
            constructor() {
                this.device = null;
                this.context = null;
                this.pipeline = null;

                // Transform State
                this.tx = 0; this.ty = 0;
                this.sx = 1; this.sy = 1;

                // Standard Buffer Size (std140 alignment)
                // Res(8) + Scale(8) + Color(16) + Trans(8) + Width(4) + Pad(4) = 48 bytes
                this.uniformBufferSize = 48;
            }

            async initialize(canvas) {
                if (!navigator.gpu) throw new Error("WebGPU not supported");
                const adapter = await navigator.gpu.requestAdapter();
                this.device = await adapter.requestDevice();
                this.context = canvas.getContext("webgpu");
                this.presentationFormat = navigator.gpu.getPreferredCanvasFormat();

                this.context.configure({
                    device: this.device,
                    format: this.presentationFormat,
                    alphaMode: "premultiplied",
                });

                const shaderModule = this.device.createShaderModule({ code: shaderCode });

                this.pipeline = this.device.createRenderPipeline({
                    label: "Line Pipeline",
                    layout: "auto",
                    vertex: {
                        module: shaderModule,
                        entryPoint: "vs_main",
                        buffers: [{
                            arrayStride: 28, // 7 floats * 4 bytes
                            stepMode: "vertex",
                            attributes: [
                                { shaderLocation: 0, offset: 0, format: "float32x2" }, // curr
                                { shaderLocation: 1, offset: 8, format: "float32x2" }, // prev
                                { shaderLocation: 2, offset: 16, format: "float32x2" }, // next
                                { shaderLocation: 3, offset: 24, format: "float32" },  // direction
                            ]
                        }]
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: "fs_main",
                        targets: [{ format: this.presentationFormat }]
                    },
                    primitive: { topology: "triangle-strip" }
                });
            }

            // --- Transform Functions ---

            /**
             * Sets the translation for the CURRENT draw call.
             * To move an object, call this before calling draw().
             */
            translate(x, y) {
                this.tx = x;
                this.ty = y;
            }

            /**
             * Sets the scale for the CURRENT draw call.
             * Accepts separate X and Y factors.
             */
            scale(x, y) {
                this.sx = x;
                this.sy = y; // Can now stretch lines non-uniformly
            }

            // ---------------------------

            clear(r = 0, g = 0, b = 0, a = 0) {
                const commandEncoder = this.device.createCommandEncoder();
                const textureView = this.context.getCurrentTexture().createView();

                const passEncoder = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r, g, b, a },
                        loadOp: "clear",
                        storeOp: "store",
                    }]
                });
                passEncoder.end();
                this.device.queue.submit([commandEncoder.finish()]);
            }

            draw(xArray, yArray, color = { r: 1, g: 1, b: 1, a: 1 }, width = 5.0) {
                if (xArray.length !== yArray.length || xArray.length < 2) return;

                const count = xArray.length;
                const device = this.device;
                const canvas = this.context.canvas;

                // 1. Prepare Uniform Data (aligned to std140)
                // Struct: Resolution(vec2), Scale(vec2), Color(vec4), Translation(vec2), Width(f32)
                const uniformValues = new Float32Array([
                    canvas.width, canvas.height,        // Offset 0: Resolution
                    this.sx, this.sy,                   // Offset 8: Scale (Separate X/Y)
                    color.r, color.g, color.b, color.a, // Offset 16: Color
                    this.tx, this.ty,                   // Offset 32: Translation
                    width, 0,                    // Offset 40: Width + 4 bytes padding to reach 48 total
                ]);

                const uniformBuffer = device.createBuffer({
                    size: this.uniformBufferSize,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

                const bindGroup = device.createBindGroup({
                    layout: this.pipeline.getBindGroupLayout(0),
                    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
                });

                // 2. Generate Geometry (CPU side expansion for simplicity in this example)
                // We calculate vertices for a triangle strip (2 vertices per point)
                const vertexCount = count * 2;
                const vertexData = new Float32Array(count * 2 * 7);
                for (let i = 0; i < count; i++) {
                    const cx = xArray[i];
                    const cy = yArray[i];

                    // Identify neighbors
                    const px = (i === 0) ? cx : xArray[i - 1];
                    const py = (i === 0) ? cy : yArray[i - 1];
                    const nx = (i === count - 1) ? cx : xArray[i + 1];
                    const ny = (i === count - 1) ? cy : yArray[i + 1];

                    // Vertex A (Direction 1.0)
                    let idxA = i * 2 * 7;
                    vertexData[idxA + 0] = cx; vertexData[idxA + 1] = cy; // curr
                    vertexData[idxA + 2] = px; vertexData[idxA + 3] = py; // prev
                    vertexData[idxA + 4] = nx; vertexData[idxA + 5] = ny; // next
                    vertexData[idxA + 6] = 1.0;                          // side

                    // Vertex B (Direction -1.0)
                    let idxB = (i * 2 + 1) * 7;
                    vertexData[idxB + 0] = cx; vertexData[idxB + 1] = cy;
                    vertexData[idxB + 2] = px; vertexData[idxB + 3] = py;
                    vertexData[idxB + 4] = nx; vertexData[idxB + 5] = ny;
                    vertexData[idxB + 6] = -1.0;
                }

                // console.log(vertexData)

                const vertexBuffer = device.createBuffer({
                    size: vertexData.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true,
                });
                new Float32Array(vertexBuffer.getMappedRange()).set(vertexData);
                vertexBuffer.unmap();

                // 3. Render
                const commandEncoder = device.createCommandEncoder();
                const passEncoder = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: this.context.getCurrentTexture().createView(),
                        loadOp: "load", // Keep previous contents
                        storeOp: "store",
                    }]
                });

                passEncoder.setPipeline(this.pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.setVertexBuffer(0, vertexBuffer);
                passEncoder.draw(vertexCount);
                passEncoder.end();
                device.queue.submit([commandEncoder.finish()]);
            }
        }

        (async () => {
            const canvas = document.getElementById("gpuCanvas")

            const renderer = new WebGPULineRenderer();
            await renderer.initialize(canvas);

            // Data for a box
            const points = 100;
            const xBox = new Float32Array(points);
            const yBox = new Float32Array(points);
            let time = 0;




            function render() {
                // 1. Clear the screen (Erasing previous frame)
                renderer.clear(0, 0, 0, 1);
                renderer.translate(0, 0);
                renderer.scale(1, 1);

                
            for (let i = 0; i < points; i++) {
                xBox[i] = (i / points) * 1600;
                yBox[i] = 300 + Math.sin((i * 0.1) + time) * 200;
            }

                // 2. Draw FIRST line (Moving)
                // We update translate, then call draw.
                renderer.translate(0, 0);
                renderer.scale(1.0, 1.0);
                renderer.draw(xBox, yBox, { r: 1, g: 0, b: 0, a: 1 }, 10);

                // 3. Draw SECOND line (Stationary / Stretched)
                // We change translate/scale again for the next object.
                // This demonstrates "separate scale values" (stretched 2x horizontally)
                renderer.translate(900, 100);
                renderer.scale(2.0, 1.0);
                renderer.draw(xBox, yBox, { r: 0, g: 1, b: 0, a: 1 }, 10);

                time += 0.05;

                // console.log(time, xBox, yBox)   

                requestAnimationFrame(render);
            }

            render();
        })();
    </script>
</body>

</html>
