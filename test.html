<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <canvas id="gpuCanvas" width="1800" height="1600" style="background: #111; width: 80vw; height:auto;"></canvas>


    <script>
        const shaderCode = `
struct Uniforms {
  resolution : vec2f,
  color : vec4f,
  width : f32,
};

@group(0) @binding(0) var<uniform> uniforms : Uniforms;

struct VertexOutput {
  @builtin(position) position : vec4f,
};

// We pass 4 instances of the same point to create a quad (2 triangles) per segment
// effectively, but here we use a specialized approach:
// We read the current point, previous, and next to calculate the "miter" direction.
//
// Attributes:
// location(0): current point (vec2)
// location(1): previous point (vec2)
// location(2): next point (vec2)
// location(3): direction (-1 or 1) for the side of the line

@vertex
fn vs_main(
  @location(0) curr : vec2f,
  @location(1) prev : vec2f,
  @location(2) next : vec2f,
  @location(3) direction : f32,
  @builtin(vertex_index) vIdx : u32
) -> VertexOutput {
  
  var output : VertexOutput;
  let aspect = uniforms.resolution.x / uniforms.resolution.y;
  let halfWidth = uniforms.width / 2.0;

  // Calculate tangents
  // If prev == curr, it's the start. If next == curr, it's the end.
  
  var dirA = normalize(curr - prev);
  var dirB = normalize(next - curr);

  // Handle start/end caps simply by copying the existing direction
  if (all(curr == prev)) { dirA = dirB; }
  if (all(curr == next)) { dirB = dirA; }

  // Calculate the tangent (average of the two directions)
  var tangent = normalize(dirA + dirB);
  
  // Calculate the miter normal (perpendicular to tangent)
  var normal = vec2f(-tangent.y, tangent.x);
  
  // Miter length adjustment to prevent thin corners
  var miter = vec2f(-dirA.y, dirA.x); // normal of segment A
  let miterDot = dot(miter, normal);
  
  // Prevent blown out miters at sharp angles
  let miterLength = halfWidth / max(miterDot, 0.1); 

  // Offset position
  let offset = normal * direction * miterLength;
  let pos = curr + offset;

  // Convert to Clip Space (-1 to 1)
  // Assumes input coordinates are in pixel space (0 to width, 0 to height)
  let clipX = (pos.x / uniforms.resolution.x) * 2.0 - 1.0;
  let clipY = (1.0 - (pos.y / uniforms.resolution.y)) * 2.0 - 1.0; // Flip Y for typical canvas coords

  output.position = vec4f(clipX, clipY, 0.0, 1.0);
  return output;
}

@fragment
fn fs_main() -> @location(0) vec4f {
  return uniforms.color;
}
`;

        class WebGPULineRenderer {
            constructor() {
                this.device = null;
                this.context = null;
                this.pipeline = null;
                this.uniformBuffer = null;
                this.bindGroup = null;
                this.presentationFormat = null;
            }

            /**
             * Initializes the WebGPU device, context, and pipeline.
             * @param {HTMLCanvasElement} canvas 
             */
            async initialize(canvas) {
                if (!navigator.gpu) {
                    throw new Error("WebGPU not supported on this browser.");
                }

                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    throw new Error("No appropriate GPUAdapter found.");
                }

                this.device = await adapter.requestDevice();
                this.context = canvas.getContext("webgpu");
                this.presentationFormat = navigator.gpu.getPreferredCanvasFormat();

                this.context.configure({
                    device: this.device,
                    format: this.presentationFormat,
                    alphaMode: "premultiplied",
                });

                // --- Create Shader Module ---
                const shaderModule = this.device.createShaderModule({
                    label: "Line Shader",
                    code: shaderCode // (The WGSL string from above)
                });

                // --- Create Pipeline Layout ---
                // We need a uniform buffer for Resolution, Color, and Width
                // struct Uniforms { vec2f res, vec4f color, f32 width } -> 4+4+16+4 = 28 bytes -> pad to 32
                this.uniformBufferSize = 48;

                // --- Create Render Pipeline ---
                this.pipeline = this.device.createRenderPipeline({
                    label: "Line Pipeline",
                    layout: "auto",
                    vertex: {
                        module: shaderModule,
                        entryPoint: "vs_main",
                        buffers: [
                            // We will use instancing or specialized buffer interleaving.
                            // To keep it simple but performant, we will build a single interleaved buffer 
                            // per draw call containing: [currX, currY, prevX, prevY, nextX, nextY, direction]
                            {
                                arrayStride: 28, // 7 floats * 4 bytes
                                stepMode: "vertex",
                                attributes: [
                                    { shaderLocation: 0, offset: 0, format: "float32x2" },  // curr
                                    { shaderLocation: 1, offset: 8, format: "float32x2" },  // prev
                                    { shaderLocation: 2, offset: 16, format: "float32x2" }, // next
                                    { shaderLocation: 3, offset: 24, format: "float32" },   // direction
                                ]
                            }
                        ]
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: "fs_main",
                        targets: [{ format: this.presentationFormat }]
                    },
                    primitive: {
                        topology: "triangle-strip",
                        stripIndexFormat: undefined,
                    }
                });
            }

            /**
             * Clears the canvas to a transparent or specific color.
             * @param {number} r Red (0-1)
             * @param {number} g Green (0-1)
             * @param {number} b Blue (0-1)
             * @param {number} a Alpha (0-1)
             */
            clear(r = 0, g = 0, b = 0, a = 0) {
                const commandEncoder = this.device.createCommandEncoder();
                const textureView = this.context.getCurrentTexture().createView();

                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r, g, b, a },
                        loadOp: "clear",
                        storeOp: "store",
                    }]
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.end();
                this.device.queue.submit([commandEncoder.finish()]);
            }

            /**
             * Draws a line strip defined by separate X and Y arrays.
             * @param {Float32Array} xArray - Array of X coordinates
             * @param {Float32Array} yArray - Array of Y coordinates
             * @param {object} color - {r, g, b, a}
             * @param {number} width - Line width in pixels
             */
            draw(xArray, yArray, color = { r: 1, g: 1, b: 1, a: 1 }, width = 5.0) {
                if (xArray.length !== yArray.length || xArray.length < 2) return;

                const count = xArray.length;
                const device = this.device;
                const canvas = this.context.canvas;

       // --- 1. Update Uniforms (Corrected for Alignment) ---
    const uniformBuffer = device.createBuffer({
        size: this.uniformBufferSize, // 48 bytes
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // We must manually insert padding to match the GPU's memory layout
    const uniformValues = new Float32Array([
        canvas.width, canvas.height, // Bytes 0-8: Resolution
        0, 0,                        // Bytes 8-16: PADDING (Must be skipped)
        color.r, color.g, color.b, color.a, // Bytes 16-32: Color (Starts at 16-byte boundary)
        width, 0, 0, 0               // Bytes 32-36: Width. Bytes 36-48: End of struct padding.
    ]);

    device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

    const bindGroup = device.createBindGroup({
        layout: this.pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
    });
                // --- 2. Generate Geometry Data ---
                // For every point on the line, we need 2 vertices (top and bottom of the thick line).
                // Total vertices = count * 2
                //
                // Data structure per vertex:
                // Curr(2), Prev(2), Next(2), Direction(1) = 7 floats

                const vertexCount = count * 2;
                const floatCount = vertexCount * 7;
                const vertexData = new Float32Array(floatCount);

                let ptr = 0;

                for (let i = 0; i < count; i++) {
                    const cx = xArray[i];
                    const cy = yArray[i];

                    // Determine Previous
                    const px = (i === 0) ? cx : xArray[i - 1];
                    const py = (i === 0) ? cy : yArray[i - 1];

                    // Determine Next
                    const nx = (i === count - 1) ? cx : xArray[i + 1];
                    const ny = (i === count - 1) ? cy : yArray[i + 1];

                    // Add two vertices for this point (one with dir -1, one with dir 1)

                    // Vertex 1 (Top/Left)
                    vertexData[ptr++] = cx; vertexData[ptr++] = cy; // curr
                    vertexData[ptr++] = px; vertexData[ptr++] = py; // prev
                    vertexData[ptr++] = nx; vertexData[ptr++] = ny; // next
                    vertexData[ptr++] = 1.0;                        // direction

                    // Vertex 2 (Bottom/Right)
                    vertexData[ptr++] = cx; vertexData[ptr++] = cy; // curr
                    vertexData[ptr++] = px; vertexData[ptr++] = py; // prev
                    vertexData[ptr++] = nx; vertexData[ptr++] = ny; // next
                    vertexData[ptr++] = -1.0;                       // direction
                }

                const vertexBuffer = device.createBuffer({
                    size: vertexData.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true,
                });
                new Float32Array(vertexBuffer.getMappedRange()).set(vertexData);
                vertexBuffer.unmap();

                // --- 3. Execute Render Pass ---
                const commandEncoder = device.createCommandEncoder();
                const textureView = this.context.getCurrentTexture().createView();

                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        loadOp: "load", // Do not clear, draw on top of existing
                        storeOp: "store",
                    }]
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(this.pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.setVertexBuffer(0, vertexBuffer);
                passEncoder.draw(vertexCount);
                passEncoder.end();

                device.queue.submit([commandEncoder.finish()]);
            }
        }

        (async () => {
            const canvas = document.getElementById("gpuCanvas");
            canvas.width = 1800;
            canvas.height = 1600;
            document.body.appendChild(canvas);

            const renderer = new WebGPULineRenderer();
            await renderer.initialize(canvas);

            // 1. Clear the screen
            renderer.clear(0.1, 0.1, 0.1, 1.0); // Dark grey background

            // 2. Prepare Data (Sine Wave)
            const points = 100;
            const xData = new Float32Array(points);
            const yData = new Float32Array(points);

            for (let i = 0; i < points; i++) {
                xData[i] = (i / points) * 1600;
                yData[i] = 300 + Math.sin(i * 0.1) * 200;
            }

            // 3. Draw the line
            // Red line, 20px wide
            renderer.draw(xData, yData, { r: 1.0, g: 0.2, b: 0.2, a: 1.0 }, 20.0);

            // Draw another line (Green zigzag)
            const x2 = new Float32Array([50, 150, 250, 350]);
            const y2 = new Float32Array([50, 150, 50, 150]);
            renderer.draw(x2, y2, { r: 0.2, g: 1.0, b: 0.2, a: 1.0 }, 10.0);

        })();
    </script>
</body>

</html>
