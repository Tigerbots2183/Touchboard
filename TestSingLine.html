<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Line Plotter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px; border-radius: 8px;
            pointer-events: none;
            border: 1px solid #444;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Points: <span id="pt-count">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
        <div>CAMERA: <span id="camera"></span></div>
        <div>Controls: Drag to Pan, Scroll to Zoom</div>
    </div>
    <canvas id="gpuCanvas"></canvas>

    <script id="wgsl" type="x-shader/x-wgsl">
        struct Camera {
            offset: vec2<f32>,       // Global offset (pan)
            scale: vec2<f32>,        // Zoom levels
            screen_size: vec2<f32>,  // Canvas resolution
            line_width: f32,
            buffer_capacity: u32,
            head_index: u32,         // Ring buffer write head
            stride: u32,             // LOD stride (skip n points)
        };

        @group(0) @binding(0) var<uniform> cam: Camera;
        @group(0) @binding(1) var<storage, read> points: array<vec2<f32>>;

        struct VertexOutput {
            @builtin(position) position: vec4<f32>,
            @location(0) uv: vec2<f32>,
        };

        // Helper: Project world point to Screen Pixels
        fn to_pixels(world_pos: vec2<f32>) -> vec2<f32> {
            // World -> NDC
            let ndc = (world_pos + cam.offset) * cam.scale; 
            // NDC -> Pixels (0,0 is center)
            return ndc * cam.screen_size * 0.5;
        }

        @vertex
        fn vs_main(
            @builtin(vertex_index) v_idx: u32,     // 0..3 (Corner of quad)
            @builtin(instance_index) i_idx: u32    // Segment Index
        ) -> VertexOutput {
            let cap_i = i32(cam.buffer_capacity);
            let head_i = i32(cam.head_index);
            let stride_i = i32(cam.stride);
            
            // Current Drawing Index (Logical)
            // We draw segments. Segment 0 connects point 0 and 1.
            let logical_idx = i32(i_idx) * stride_i;

            // Resolve Ring Buffer Indices using Signed Math to allow negative lookbacks
            // The "head" is the oldest point.
            
            // P1 (Current Point)
            let idx_1 = (head_i + logical_idx) % cap_i;
            // P2 (Next Point)
            let idx_2 = (head_i + logical_idx + stride_i) % cap_i;
            
            // P0 (Previous Point) - for calculating start angle
            var idx_0 = idx_1;
            if (i_idx > 0u) {
                // We add cap_i before modulo to ensure result is positive
                idx_0 = (head_i + logical_idx - stride_i + cap_i) % cap_i;
            }

            // P3 (Next Next Point) - for calculating end angle
            let idx_3 = (head_i + logical_idx + stride_i + stride_i) % cap_i;

            let p0 = points[u32(idx_0)];
            let p1 = points[u32(idx_1)];
            let p2 = points[u32(idx_2)];
            let p3 = points[u32(idx_3)];

            // Screen Space Calculations
            let s0 = to_pixels(p0);
            let s1 = to_pixels(p1);
            let s2 = to_pixels(p2);
            let s3 = to_pixels(p3);

            // Calculate Tangents
            var t0 = normalize(s1 - s0);
            var t1 = normalize(s2 - s1);
            var t2 = normalize(s3 - s2);

            // Handle Degenerate (Zero length) cases
            if (length(s2 - s1) < 0.01) { t1 = vec2<f32>(1.0, 0.0); }
            if (length(s1 - s0) < 0.01) { t0 = t1; }
            if (length(s3 - s2) < 0.01) { t2 = t1; }

            // Normals
            let n1 = vec2<f32>(-t1.y, t1.x);
            
            // Miter Directions (Angle Bisectors)
            let miter1 = normalize(vec2<f32>(-t0.y, t0.x) + n1);
            let miter2 = normalize(n1 + vec2<f32>(-t2.y, t2.x));

            // Miter Lengths (Project normal onto miter)
            let len1 = 1.0 / max(0.2, dot(miter1, n1));
            let len2 = 1.0 / max(0.2, dot(miter2, n1));

            // Quad Expansion
            // v_idx 0: P1 Left, 1: P2 Left, 2: P1 Right, 3: P2 Right
            // Triangle Strip Order: 0(BL), 1(TL), 2(BR), 3(TR) ?? No, usually 0,1,2,3 logic depends on draw call.
            // Let's use array lookup for standard 0,1,2,3 explicit triangle strip logic
            
            var corners = array<vec2<f32>, 4>(
                vec2<f32>(-1.0, 0.0), // P1 Left
                vec2<f32>(-1.0, 1.0), // P2 Left
                vec2<f32>( 1.0, 0.0), // P1 Right
                vec2<f32>( 1.0, 1.0)  // P2 Right
            );
            let c = corners[v_idx]; // x=side, y=end(0 or 1)

            let width = (cam.line_width * 0.5) + 1.0; // +1.0 for Antialiasing

            var final_px = vec2<f32>(0.0);
            
            if (c.y == 0.0) {
                // At P1
                var offset = miter1 * c.x * width * len1;
                // Clamp bad miters (sharp spikes)
                if (length(offset) > width * 3.0) { offset = n1 * c.x * width; }
                final_px = s1 + offset;
            } else {
                // At P2
                var offset = miter2 * c.x * width * len2;
                if (length(offset) > width * 3.0) { offset = n1 * c.x * width; }
                final_px = s2 + offset;
            }

            // Convert Pixels back to NDC
            let ndc_pos = final_px / (cam.screen_size * 0.5);

            var out: VertexOutput;
            out.position = vec4<f32>(ndc_pos, 0.0, 1.0);
            out.uv = vec2<f32>(c.x, 0.0); // Pass side (-1 to 1) for AA
            return out;
        }

        @fragment
        fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
            let dist = abs(in.uv.x);
            // Antialiasing: Soften the last pixel at the edge
            // We expanded by +1.0 pixel in vertex shader. 
            // The "solid" core is line_width/2. The total width is line_width/2 + 1.
            // We approximate this by smoothstepping the outer edge.
            
            let alpha = 1.0 - smoothstep(0.7, 1.0, dist);
            
            let color = vec3<f32>(0.0, 1.0, 0.8); // Cyan Color
            return vec4<f32>(color, alpha);
        }
    </script>

    <script type="module">
        class WebGPUPlotter {
            constructor(canvas) {
                this.canvas = canvas;
                this.device = null;
                this.pipeline = null;

                // Camera
                this.camera = { x: 0, y: 0, zoomX: .002, zoomY: 0.008 };
                
                // Ring Buffer State
                this.maxPoints = 0;
                this.headIndex = 0;
                this.pointsInBuffer = 0;
                this.isFull = false;

                // Settings
                this.lineWidth = 3.0;
            }

            async initialize() {
                if (!navigator.gpu) throw new Error("WebGPU not supported");
                const adapter = await navigator.gpu.requestAdapter();
                this.device = await adapter.requestDevice();
                this.context = this.canvas.getContext('webgpu');
                this.presentationFormat = navigator.gpu.getPreferredCanvasFormat();

                this.context.configure({
                    device: this.device,
                    format: this.presentationFormat,
                    alphaMode: 'premultiplied',
                });

                // Set Buffer Size based on limits (e.g., 256MB)
                const mb = 1024 * 1024;
                const maxBufferSize = Math.min(this.device.limits.maxStorageBufferBindingSize, 256 * mb);
                this.maxPoints = Math.floor(maxBufferSize / 8); // 2 floats (8 bytes) per point

                // Create Resources
                this.pointBuffer = this.device.createBuffer({
                    size: this.maxPoints * 8,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
                });

                this.uniformBuffer = this.device.createBuffer({
                    size: 64, // Padded for alignment
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                });

                // Create Pipeline
                const module = this.device.createShaderModule({ code: document.getElementById('wgsl').textContent });
                
                this.pipeline = this.device.createRenderPipeline({
                    layout: 'auto',
                    vertex: { module, entryPoint: 'vs_main' },
                    fragment: { 
                        module, entryPoint: 'fs_main',
                        targets: [{
                            format: this.presentationFormat,
                            blend: {
                                color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                                alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
                            }
                        }]
                    },
                    primitive: { topology: 'triangle-strip' }
                });

                this.bindGroup = this.device.createBindGroup({
                    layout: this.pipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: { buffer: this.uniformBuffer } },
                        { binding: 1, resource: { buffer: this.pointBuffer } }
                    ]
                });

                this.setupInputs();
            }

            // Corrected: Takes separate X and Y arrays
            addPoints(xArr, yArr) {
                if (xArr.length !== yArr.length) return;
                
                const count = xArr.length;
                // Create interleaved data [x0, y0, x1, y1...]
                const interleaved = new Float32Array(count * 2);
                for(let i=0; i<count; i++) {
                    interleaved[i*2] = xArr[i];
                    interleaved[i*2+1] = yArr[i];
                }

                let writeIdx = this.headIndex;
                let remaining = count;
                let offset = 0;

                // Ring Buffer Upload Logic
                while(remaining > 0) {
                    const spaceAtEnd = this.maxPoints - writeIdx;
                    const chunk = Math.min(remaining, spaceAtEnd);

                    this.device.queue.writeBuffer(
                        this.pointBuffer,
                        writeIdx * 8, // Byte offset
                        interleaved,
                        offset * 2,   // Data offset (elements) (x2 because Float32Array view)
                        chunk * 2     // Elements to write
                    );

                    writeIdx = (writeIdx + chunk) % this.maxPoints;
                    offset += chunk;
                    remaining -= chunk;
                }

                this.headIndex = writeIdx;
                this.pointsInBuffer += count;
                if (this.pointsInBuffer > this.maxPoints) {
                    this.pointsInBuffer = this.maxPoints;
                    this.isFull = true;
                }
            }

            render() {
                if (!this.device) return;

                // 1. Calculate Active Points & Stride
                // If not full, we use pointsInBuffer. If full, maxPoints.
                const count = this.isFull ? this.maxPoints : this.pointsInBuffer;
                
                // Safety: Don't render if empty
                if (count < 2) return;

                // LOD Logic: If zoomed out, skip points to maintain performance
                // Heuristic: If we have 1M points, but screen is 1000px wide, we don't need 1M vertices.
                // Stride should increase as Zoom X decreases.
                
                let stride = 1;
                // Very basic LOD heuristic
                if (this.camera.zoomX < 0.5) stride = 2;
                if (this.camera.zoomX < 0.1) stride = 10;
                if (this.camera.zoomX < 0.01) stride = 50;
                
                // IMPORTANT FIX: Stride cannot exceed half the available points, 
                // otherwise we can't form a single segment.
                if (stride > count / 2) stride = Math.max(1, Math.floor(count / 2));

                // 2. Update Uniforms
                const uData = new ArrayBuffer(64);
                const f32 = new Float32Array(uData);
                const u32 = new Uint32Array(uData);

                f32[0] = this.camera.x;
                f32[1] = this.camera.y;
                f32[2] = this.camera.zoomX;
                f32[3] = this.camera.zoomY;
                f32[4] = this.canvas.width;
                f32[5] = this.canvas.height;
                f32[6] = this.lineWidth;

                u32[7] = this.maxPoints;
                u32[8] = this.isFull ? this.headIndex : 0; // If not full, logical 0 is physical 0. If full, logical 0 is head.
                u32[9] = stride;

                this.device.queue.writeBuffer(this.uniformBuffer, 0, uData);

                // 3. Draw
                const encoder = this.device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [{
                        view: this.context.getCurrentTexture().createView(),
                        clearValue: { r: 0.05, g: 0.05, b: 0.05, a: 1.0 },
                        loadOp: 'clear', storeOp: 'store'
                    }]
                });

                pass.setPipeline(this.pipeline);
                pass.setBindGroup(0, this.bindGroup);
                
                // Instance Count = (Points / Stride) - 1
                const instances = Math.floor((count - 1) / stride);
                
                if (instances > 0) {
                    pass.draw(4, instances); // 4 vertices per instance (Quad)
                }

                pass.end();
                this.device.queue.submit([encoder.finish()]);

                // Update UI
                document.getElementById('pt-count').innerText = count.toLocaleString();

                document.getElementById('camera').innerText = JSON.stringify(this.camera);

            }

            setupInputs() {
                let dragging = false, lastX=0, lastY=0;
                
                this.canvas.addEventListener('mousedown', e => {
                    dragging = true; lastX = e.clientX; lastY = e.clientY;
                });
                
                window.addEventListener('mouseup', () => dragging = false);
                
                this.canvas.addEventListener('mousemove', e => {
                    if (!dragging) return;
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;
                    
                    // Pan Speed adjusted by zoom
                    // We move opposite to mouse to "drag" the world
                    this.camera.x += (dx / this.canvas.width * 2) / this.camera.zoomX;
                    this.camera.y -= (dy / this.canvas.height * 2) / this.camera.zoomY; // Y is usually flipped in WebGPU NDC
                    
                    lastX = e.clientX; lastY = e.clientY;
                });

                this.canvas.addEventListener('wheel', e => {
                    e.preventDefault();
                    const factor = e.deltaY > 0 ? 0.9 : 1.1;
                    if (e.shiftKey) this.camera.zoomX *= factor;
                    else if (e.ctrlKey) this.camera.zoomY *= factor;
                    else {
                        this.camera.zoomX *= factor;
                        this.camera.zoomY *= factor;
                    }
                }, { passive: false });
            }
        }

        // --- Implementation ---
        const canvas = document.getElementById('gpuCanvas');
        const plotter = new WebGPUPlotter(canvas);
        const fpsEl = document.getElementById('fps');

        // Initial Layout
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        await plotter.initialize();

        // --- Demo Data Generation ---
        let t = 0;
        let frameCount = 0;
        let lastTime = performance.now();

        function loop() {
            // Generate some data
            const batch = 1000;
            const xData = new Float32Array(batch);
            const yData = new Float32Array(batch);
            
            for(let i=0; i<batch; i++) {
                t += 0.01;
                xData[i] = t; // X increases
                yData[i] = Math.sin(t) + Math.cos(t * 3.5) * 2; // Y Wave
            }
            
            plotter.addPoints(xData, yData);

            // Auto-Center Camera on the "head" of the data initially
            // Once user interacts, we could disable this, but for demo we just keep it simple.
            // Let's just set the camera to look at the middle of the generated data range
            // For a scrolling oscilloscope effect:
            // plotter.camera.x = -t + 5.0; // Keep current time near right edge

            // Alternatively, static camera looking at 0,0:
            // The data starts at x=0. To see it, camera offset should be around -t/2? 
            // Actually, let's just make the camera follow the head loosely.
            if (!plotter.userInteracted) { 
                 // Simple logic: keep the latest data point somewhat visible
                 plotter.camera.x = -t + 2.0;
                 plotter.camera.zoomX = 0.0005; // Zoom out to see more history
                 plotter.camera.zoomY = 0.02;
            }

            plotter.render();

            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fpsEl.innerText = frameCount;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(loop);
        }

        // Hack to detect user interaction to stop auto-scroll
        canvas.addEventListener('mousedown', () => plotter.userInteracted = true);
        canvas.addEventListener('wheel', () => plotter.userInteracted = true);

        loop();

    </script>
</body>
</html>
